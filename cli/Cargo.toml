[package]
name = "sqlite4n6"
version.workspace = true
edition.workspace = true
license.workspace = true
# `authors` is required by cargo-deb (it derives the .deb copyright from it).
authors = ["Albert Hui <albert@securityronin.com>"]
readme = "README.md"
description = "sqlite4n6 — read-only SQLite forensic CLI: carve deleted records and grade anomalies into severity-ranked findings, single static binary."

[lib]
name = "sqlite4n6"
path = "src/lib.rs"

[[bin]]
name = "sqlite4n6"
path = "src/main.rs"

[dependencies]
sqlite-core = { workspace = true }
sqlite-forensic = { workspace = true }
forensicnomicon = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true

# Debian package (.deb) built by `cargo deb --package sqlite4n6` in the release
# workflow. The crate and the binary are both `sqlite4n6`; cargo-deb rewrites the
# `target/release/` asset path for cross-target builds.
[package.metadata.deb]
maintainer = "SecurityRonin <security-ronin@users.noreply.github.com>"
section = "utils"
priority = "optional"
extended-description = """\
sqlite4n6 is a read-only SQLite forensic CLI. It carves deleted records out of \
a database's free (unallocated) space — freelist pages, in-page free blocks, \
dropped-table pages, and an uncheckpointed WAL overlay — and grades \
forensically-notable anomalies into severity-ranked findings. It opens the \
evidence file read-only and never writes the file or its sidecars."""
assets = [
    ["target/release/sqlite4n6", "usr/bin/", "755"],
]
