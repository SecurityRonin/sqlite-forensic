# cargo-deny configuration — supply-chain and licence gate.
[graph]
all-features = false
# The fuzz crate is a standalone workspace; only check the main workspace.
exclude = ["sqlite-forensic-fuzz"]

[advisories]
version = 2
yanked = "deny"
# Interim, time-boxed ignore (added 2026-07): quick-xml < 0.41 DoS advisories.
# Both are DoS-only (quadratic attribute scan / unbounded namespace allocation),
# not RCE, and reach the tree only via `calamine v0.35.0`, a DEV-dependency of the
# CLI that pins `quick-xml = "^0.39"` — so the tree cannot bump to >= 0.41 until
# calamine widens its requirement. No untrusted input is parsed through it in the
# shipped library/CLI. Drop this ignore once calamine allows quick-xml >= 0.41.
ignore = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]

[licenses]
version = 2
# This crate is MIT; permit only permissive, non-copyleft licences in the tree.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "ISC", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
