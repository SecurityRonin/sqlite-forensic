[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sqlite4n6"
version = "0.9.0"
description = "Python bindings for the sqlite-forensic carver/auditor/timeline"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# abi3 wheel; the compiled module is `sqlite4n6`.
features = ["pyo3/extension-module"]
